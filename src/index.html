<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola mundo | Nginx con Docker Compose</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #071a2b, #0f3d56);
      color: #f4fbff;
    }

    main {
      width: min(90%, 42rem);
      padding: 3rem;
      text-align: center;
      background: rgb(255 255 255 / 8%);
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 1.25rem;
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 28%);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.4rem, 8vw, 5rem);
    }

    p {
      margin: 0;
      color: #a9e3ff;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Hola mundo!</h1>
    <p>Nginx está funcionando con Docker Compose.</p>
  </main>
</body>
</html>
